<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport so a mis-tap can't pinch-zoom or scroll the game away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Donut Rain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        background-color: #000;
        height: 100%;
        overflow: hidden;
        /* Kill the tap-highlight and browser touch gestures so drags stay in-game. */
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
        touch-action: none;
      }
      /* Unobtrusive escape hatch to the full desktop adventure. */
      #fullgame {
        position: fixed;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-family: monospace;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.45);
        text-decoration: none;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <a id="fullgame" href="/?mode=classic">full game &#8599;</a>
    <script type="module" src="/src/arcade/main.js"></script>
  </body>
</html>
