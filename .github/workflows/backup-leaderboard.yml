name: Backup leaderboard

# Three jobs in one:
#   1. Keep-alive WRITE — the important one. It UPDATEs a one-row `keepalive`
#      table so Supabase sees a real database write. Anonymous REST *reads* (what
#      this workflow used to rely on) do NOT count as activity on the free tier,
#      so the project paused despite twice-weekly backups. A write should count.
#      See docs/keepalive-setup.sql — run it once or this step will 404.
#   2. Backup — keeps a version-controlled copy of the world board in the repo.
#   3. Alert — if anything above fails, open/bump a GitHub issue so a pause is
#      caught the same day instead of going silent for weeks.
#
# Runs Mon + Thu rather than weekly on purpose: the free tier pauses after
# roughly a week idle, so a 7-day cadence sits right on the threshold and one
# skipped run would let it sleep. Twice a week leaves margin.

on:
  schedule:
    - cron: '17 8 * * 1,4'   # 08:17 UTC Mondays and Thursdays
  workflow_dispatch:          # ...and on demand from the Actions tab

permissions:
  contents: write
  issues: write               # so the failure step can open/comment an alert

concurrency:
  group: leaderboard-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the credentials out of src/config.js rather than duplicating them
      # as repo secrets — they're the publishable key, already public in the
      # deployed bundle, and this way they can never drift out of sync.
      - name: Read Supabase config
        id: cfg
        run: |
          # POSIX sed rather than `grep -P`, which isn't portable.
          url=$(sed -n "s/.*SUPABASE_URL[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" src/config.js)
          key=$(sed -n "s/.*SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" src/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "World board isn't configured — nothing to back up."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # THE keep-alive. A write, not a read: reads don't reset the free-tier
      # inactivity clock (proven the hard way), a real UPDATE should.
      - name: Keep-alive write
        if: steps.cfg.outputs.skip != 'true'
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -sS -o /tmp/ka.out -w '%{http_code}' --retry 3 --retry-delay 5 -m 60 \
            -X PATCH "${URL}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"beat_at\":\"${ts}\"}") || true
          echo "keep-alive PATCH -> HTTP ${code}"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Keep-alive write failed (HTTP ${code})."
            if [ "$code" = "404" ] || [ "$code" = "401" ] || [ "$code" = "400" ]; then
              echo "The keepalive table/policy is missing — run docs/keepalive-setup.sql in the Supabase SQL editor."
            elif [ "$code" = "000" ]; then
              echo "Could not reach Supabase (host didn't resolve). The project is likely PAUSED — restore it at https://supabase.com/dashboard"
            fi
            echo "Response body:"; cat /tmp/ka.out 2>/dev/null || true
            exit 1
          fi

      - name: Fetch scores
        if: steps.cfg.outputs.skip != 'true'
        run: |
          mkdir -p backups
          # Fixed ordering + pretty-print so the diff reflects real changes
          # rather than key reshuffling. Written to a temp file first so a
          # failed request can't truncate the previous good backup.
          curl -fsS --retry 3 --retry-delay 5 -m 60 \
            "${{ steps.cfg.outputs.url }}/rest/v1/scores?select=*&order=score.desc,created_at.asc" \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -o /tmp/scores.raw.json
          node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync("/tmp/scores.raw.json", "utf8"));
            // PostgREST reports errors as a JSON object, not an array — refuse
            // to overwrite a good backup with one.
            if (!Array.isArray(rows)) throw new Error("unexpected payload: " + JSON.stringify(rows).slice(0, 200));
            fs.writeFileSync("backups/scores.json", JSON.stringify(rows, null, 2) + "\n");
            console.log("Rows backed up:", rows.length);
          '

      - name: Commit if changed
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # --porcelain (not `git diff`) so the very first run, when the file is
          # still untracked, is correctly seen as a change.
          if [ -z "$(git status --porcelain backups/scores.json)" ]; then
            echo "Board unchanged since last backup."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/scores.json
          # [skip ci] keeps a backup commit from kicking off a pointless rebuild
          # and redeploy of the site.
          git commit -m "Leaderboard backup $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # Safety net: if any step above failed, make it loud. GitHub's own
      # "run failed" email is easy to miss (a pause went unnoticed for two
      # weeks once); a tracked issue is visible and notifies on create/comment.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠️ Leaderboard keep-alive failed"
          body=$(printf '%s\n' \
            "The scheduled keep-alive/backup run failed." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "Most likely the Supabase project is PAUSED again. Restore it in the" \
            "dashboard (https://supabase.com/dashboard), then re-run this workflow" \
            "from the Actions tab to confirm it's green. If the failure was a 404" \
            "on the keep-alive write, the keepalive table is missing — run" \
            "docs/keepalive-setup.sql in the Supabase SQL editor." )
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Commented on existing alert issue #${existing}."
          else
            gh issue create --title "$title" --body "$body"
            echo "Opened a new alert issue."
          fi
